name: Build APK and AAB

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to publish on the Releases page, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      TRANSLATE_URL: ${{ vars.TRANSLATE_URL }}
      CLOUD_PROJECT_NUMBER: ${{ vars.CLOUD_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version name
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$TAG" == v* ]]; then echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.1.0-dev.$VERSION_CODE" >> "$GITHUB_ENV"; fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZidnyKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZidnyKeyboard-apk
          path: ZidnyKeyboard.apk

      - name: Build AAB for Google Play (signed when the upload key secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew bundleRelease --no-daemon
          # Only a signed AAB can be uploaded to Play, so keep it only when the key was used.
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then cp app/build/outputs/bundle/release/app-release.aab ZidnyKeyboard.aab; fi

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: ZidnyKeyboard-aab
          path: ZidnyKeyboard.aab

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ZidnyKeyboard ${{ inputs.release_tag || github.ref_name }}
          files: |
            ZidnyKeyboard.apk
            ZidnyKeyboard.aab
          fail_on_unmatched_files: false
