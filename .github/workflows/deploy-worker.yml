name: Deploy translation server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-worker.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run server tests
        run: npm test

      # Deploys only from main, and only once the Cloudflare secrets exist (see server/README.md).
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: GOOGLE_SERVICE_ACCOUNT
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Explain missing setup
        if: github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the translation server (see server/README.md)."
